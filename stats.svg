<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="1,903 contributions all time, 1,897 in the last twelve months, 107 active days, longest streak 16 days, busiest day 144">

  <defs>
