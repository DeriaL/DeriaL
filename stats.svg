  </defs>
  <rect width="1200" height="150" rx="14" fill="url(#band)"/>
  <rect width="1200" height="150" rx="14" fill="url(#sheen)"/>
  <rect x="240.0" y="30" width="1.5" height="90" fill="url(#rule)"/>
  <rect x="480.0" y="30" width="1.5" height="90" fill="url(#rule)"/>
  <rect x="720.0" y="30" width="1.5" height="90" fill="url(#rule)"/>
  <rect x="960.0" y="30" width="1.5" height="90" fill="url(#rule)"/>
