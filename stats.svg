<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="1854 contributions in 2026, 110 active days, 33 repositories, 20+ production systems shipped">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="150" rx="14" fill="url(#band)"/>
  <rect width="1200" height="150" rx="14" fill="url(#sheen)"/>

  <rect x="300" y="30" width="1.5" height="90" fill="url(#rule)"/>
  <rect x="600" y="30" width="1.5" height="90" fill="url(#rule)"/>
  <rect x="900" y="30" width="1.5" height="90" fill="url(#rule)"/>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="150" y="78" font-size="46" font-weight="700" fill="#ffffff">1,854</text>
    <text x="150" y="104" font-size="13" font-weight="500" fill="#ffffff" fill-opacity="0.80" letter-spacing="1.5">CONTRIBUTIONS IN 2026</text>

    <text x="450" y="78" font-size="46" font-weight="700" fill="#ffffff">110</text>
    <text x="450" y="104" font-size="13" font-weight="500" fill="#ffffff" fill-opacity="0.80" letter-spacing="1.5">ACTIVE DAYS</text>

    <text x="750" y="78" font-size="46" font-weight="700" fill="#ffffff">33</text>
    <text x="750" y="104" font-size="13" font-weight="500" fill="#ffffff" fill-opacity="0.80" letter-spacing="1.5">REPOSITORIES</text>

    <text x="1050" y="78" font-size="46" font-weight="700" fill="#ffffff">20+</text>
    <text x="1050" y="104" font-size="13" font-weight="500" fill="#ffffff" fill-opacity="0.80" letter-spacing="1.5">SYSTEMS IN PRODUCTION</text>
  </g>
</svg>
